services:
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: sqlite:////data/helpflow.db
      AI_PROVIDER: mock
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]}'
    ports:
      - "8000:8000"
    volumes:
      - helpflow-data:/data
    restart: unless-stopped

volumes:
  helpflow-data:
