name: Backend

on:
  push:
    paths:
      - "apps/api/**"
      - "services/ai/**"
      - "knowledge-base/**"
      - "docker-compose.yml"
      - "scripts/smoke-p0.*"
      - ".env.example"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "services/ai/**"
      - "knowledge-base/**"
      - "docker-compose.yml"
      - "scripts/smoke-p0.*"
      - ".env.example"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helpflow_test
          POSTGRES_USER: helpflow
          POSTGRES_PASSWORD: helpflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpflow -d helpflow_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Backend and P0 acceptance tests
        run: pytest -v
      - run: PYTHONPATH=../../services/ai pytest ../../services/ai/tests -v
      - name: PostgreSQL migration and API smoke test
        env:
          DATABASE_URL: postgresql+psycopg://helpflow:helpflow@localhost:5432/helpflow_test
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://helpflow:helpflow@localhost:5432/helpflow_test
        run: |
          alembic upgrade head
          pytest tests/test_postgres_smoke.py -v
      - run: python -m compileall app
