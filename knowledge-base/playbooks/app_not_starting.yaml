# Программа не запускается, вылетает или не устанавливается (ошибка установки).
# Звонки (Teams, Zoom) и Outlook — в своих сценариях.
id: app_not_starting
title: Программа не запускается или выдаёт ошибку
service: Программы
default_urgency: medium
escalation_team: Service Desk L1 (программы)
keywords: [программа не запускается, программа не открывается, приложение не запускается, приложение не открывается, программа вылетает, приложение вылетает, закрывается сам, закрывается сама, крашится, не устанавливается, не устанавливается программа, ошибка установки, ошибка при установке, ошибку при установке, установка прерывается]
examples:
  - программа не запускается
  - программа падает с отчётом об ошибке
  - word не открывается, выдаёт ошибку
  - excel закрывается сам при запуске
  - программа зависает на заставке и закрывается
  - программа при старте показывает окно с ошибкой
  - при запуске пишет ошибка приложения
  - acrobat не открывает документы и закрывается
  - программа не устанавливается, ошибка при установке
  - установка прерывается на середине
  - ярлык на рабочем столе не открывает программу
  - при открытии файла программа крашится
  - пишет что не найдена библиотека dll
  - приложение открывается и сразу исчезает
  - офис пишет что требуется восстановление
symptoms_hints:
  не запускается: [не запуска, не открывается, не открывает, ничего не происходит, не стартует]
  вылетает: [вылета, закрывается, краш, исчеза]
  ошибка установки: [установк, устанавлива]
questions:
  - fact: error_text
    text: Что пишет программа при запуске или установке? Можно своими словами или «ничего не пишет».
    kind: text
steps:
  - id: restart_app_fully
    title: Закройте программу полностью и откройте снова
    instruction: "Windows: нажмите Ctrl+Shift+Esc, выберите программу в списке → «Снять задачу». macOS: правой кнопкой по значку в Dock → «Завершить принудительно». Откройте программу снова — она должна запуститься."
    unless_symptoms: [ошибка установки]
  - id: restart_for_app
    title: Перезагрузите компьютер
    instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка». macOS: меню Apple → «Перезагрузить». После включения первой откройте эту программу — она должна запуститься, а незавершённое обновление — доустановиться."
  - id: reinstall_app
    title: Переустановка или восстановление программы
    instruction: Восстановить или переустановить программу, проверить журнал ошибок приложения и права на папку программы.
    requires_admin: true
  - id: use_web_version
    title: Поработайте в веб-версии
    instruction: Для Word, Excel и PowerPoint есть веб-версия — откройте office.com в браузере и войдите рабочим логином. Если так файл открылся — вы не выпадете из работы, а программу починим после.
    workaround: true
verify_question: Программа запускается и работает?
