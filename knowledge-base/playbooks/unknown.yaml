  - id: restart_app
    title: Перезапустите программу
    instruction: Полностью закройте программу, в которой возникла проблема, и откройте её снова.
  - id: reboot_computer_generic
    title: Перезагрузите компьютер
    instruction: Сохраните работу и перезагрузите компьютер через «Пуск» → «Перезагрузка». После загрузки повторите действие, при котором возникла ошибка.
verify_question: После этого всё работает как нужно?
