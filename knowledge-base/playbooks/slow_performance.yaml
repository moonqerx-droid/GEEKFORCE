id: slow_performance
title: Компьютер или программа работает медленно
service: Производительность
default_urgency: medium
escalation_team: Service Desk L1
# «Тормозит» is not «не открывается»: a web-page refresh does not help a slow 1С or Excel.
# Both stems are listed on purpose: a slowness word outweighs a bare service name («1с»).
keywords: [тормоз, тормозит, медленн, медлено, очень медленно, долго грузит, долго открыва, долго загруж, подвиса, висн, еле работает]
symptoms_hints:
  медленно работает одна программа: [1с, 1c, excel, эксель, браузер, chrome, outlook, программ]
  медленно работает весь компьютер: [компьютер, комп, ноутбук, ноут, всё тормозит, все тормозит, система]
questions:
  - fact: colleagues_affected
    text: У коллег это тоже работает медленно?
    kind: yes_no
steps:
  - id: close_heavy_apps
    title: Закройте лишнее
    instruction: Закройте программы и вкладки браузера, которыми сейчас не пользуетесь. Если тормозит одна программа — сохраните работу, закройте её полностью и откройте снова.
    unless: {colleagues_affected: ["yes"]}
  - id: restart_computer
    title: Перезагрузите компьютер
    instruction: Сохраните файлы и выберите Пуск → Перезагрузка (именно перезагрузку, а не завершение работы) — так освобождается память и закрываются зависшие процессы.
    unless: {colleagues_affected: ["yes"]}
  - id: check_disk_space
    title: Проверьте свободное место
    instruction: Откройте «Этот компьютер». Если на диске C осталось меньше 10 % места, очистите корзину и удалите ненужное из папки «Загрузки».
    when_symptoms: [медленно работает весь компьютер]
    unless: {colleagues_affected: ["yes"]}
escalation_note: Если медленно у нескольких человек сразу, дело обычно на сервере — это чинят специалисты.
verify_question: Стало работать с нормальной скоростью?
