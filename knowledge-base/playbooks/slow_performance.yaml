id: slow_performance
title: Компьютер или программа работает медленно
service: Производительность
default_urgency: medium
escalation_team: Service Desk L1
# «Тормозит» is not «не открывается»: a web-page refresh does not help a slow 1С or Excel.
# Both stems are listed on purpose: a slowness word outweighs a bare service name («1с»).
keywords: [тормоз, тормозит, медленн, медлено, очень медленно, долго грузит, долго открыва, долго загруж, подвиса, висн, еле работает, подтормаж, ползет, еле шевел, еле ворочает, пыхтит, жрет, сжирает, ест памят, ест много памяти, не хватает памяти, весь процессор, вечность, по полчаса, полчаса грузит, долго думает, по несколько минут, по минуте]
examples:
  - компьютер тормозит
  - всё очень медленно работает
  - 1с тормозит
  - ноутбук долго загружается
  - excel зависает на больших файлах
  - программа подвисает
  - комп тупит
  - браузер медленно открывает страницы
  - всё виснет
symptoms_hints:
  одна программа: [1с, 1c, excel, эксель, браузер, chrome, outlook, программ]
  весь компьютер: [компьютер, комп, ноутбук, ноут, всё тормозит, все тормозит, система]
questions:
  - fact: colleagues_affected
    text: У коллег это тоже работает медленно?
    why: "Если тормозит у всех — это сервер или сеть, а не ваш компьютер."
    kind: yes_no
steps:
  - id: close_heavy_apps
    title: Закройте лишнее
    instruction: Закройте программы и вкладки браузера, которыми сейчас не пользуетесь. Если тормозит одна программа — сохраните работу, закройте её и откройте снова. Через минуту работа должна стать быстрее.
    unless: {colleagues_affected: ["yes"]}
  - id: restart_computer
    title: Перезагрузите компьютер
    instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка» (именно перезагрузка, не выключение). macOS: меню Apple → «Перезагрузить». После перезагрузки память освободится и работа должна стать быстрее."
    unless: {colleagues_affected: ["yes"]}
  - id: check_disk_space
    title: Проверьте свободное место на диске
    instruction: "Windows: откройте «Этот компьютер» — под диском C видна полоска свободного места. macOS: меню Apple → «Об этом Mac» → «Хранилище». Если полоска красная или свободно меньше 10 % — очистите корзину и уберите ненужное из «Загрузок». После этого компьютер должен работать быстрее."
    unless: {colleagues_affected: ["yes"]}
    when_symptoms: [весь компьютер]
escalation_note: Специалист проверит, что нагружает компьютер и нет ли задержек на сервере.
verify_question: Стало работать с нормальной скоростью?
