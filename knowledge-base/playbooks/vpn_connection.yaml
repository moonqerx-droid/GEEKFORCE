symptoms_hints:
  VPN не подключается: [не подключается, не коннектится, не соединяет, не могу подключиться]
  VPN постоянно отключается: [отваливается, разрывается, отключается, отваливает]
  ошибка аутентификации VPN: [authentication failed, неверный логин, ошибка аутентификац, login failed]
questions:
  - fact: error_text
    text: Какую ошибку показывает VPN-клиент при подключении?
    kind: text
  - fact: internet_works
    text: Без VPN интернет работает — сайты вроде yandex.ru открываются?
    kind: yes_no
steps:
  - id: check_internet
    title: Проверьте домашний интернет
    instruction: Выньте вилку роутера из розетки на 30 секунд и включите обратно, подождите 2 минуты. Откройте любой сайт, например yandex.ru, — он должен открыться. Затем снова подключите VPN. Если сайты не открываются и без VPN — нажмите «Не помогло».
    when: {internet_works: ["no"]}
  - id: restart_vpn_client
    title: Перезапустите программу VPN
    instruction: "Windows: найдите значок VPN рядом с часами (он может прятаться под стрелкой «^»), нажмите правой кнопкой → «Выход». macOS: значок в строке меню вверху → «Выйти». Через 10 секунд откройте программу VPN снова и нажмите «Подключить» — должен появиться статус «Подключено»."
  - id: check_vpn_credentials
    title: Введите логин и пароль заново
    instruction: "VPN спрашивает ваш рабочий логин и пароль — те же, что для входа в компьютер. Если недавно меняли пароль, введите новый. Логин пишется как имя@компания. Если после этого пишет «неверный пароль» — нажмите «Не помогло»."
  - id: switch_vpn_server
    title: Подключитесь к запасному серверу
    instruction: В окне программы VPN откройте список в поле «Сервер», выберите запасной (обычно «vpn2» или «Backup») и нажмите «Подключить». Должен появиться статус «Подключено». Если списка серверов нет — нажмите «Не могу выполнить».
  - id: reboot_computer
    title: Перезагрузите компьютер
    instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка». macOS: меню Apple → «Перезагрузить». После включения первым делом подключите VPN — статус должен стать «Подключено»."
  - id: use_without_vpn
    title: Работайте в почте и Teams без VPN
    instruction: Пока VPN не подключается, почта в браузере (Outlook Web) и Teams обычно работают и без него — откройте их как всегда. Если открылись — вы на связи, а с VPN продолжим разбираться.
    workaround: true
verify_question: VPN подключился, и рабочие системы открываются?
