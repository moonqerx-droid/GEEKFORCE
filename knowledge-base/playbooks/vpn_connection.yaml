id: vpn_connection
title: Не подключается VPN
service: VPN
default_urgency: medium
escalation_team: Сетевые администраторы
keywords: [vpn, впн, впэн, anyconnect, forticlient, fortinet, openvpn, cisco, туннел, удалённ доступ, удаленн доступ]
examples:
  - не подключается vpn
  - впн отваливается
  - vpn пишет ошибку 809
  - не могу подключиться к рабочей сети из дома
  - forticlient не соединяется
  - anyconnect пишет login failed
  - из дома нет удалённого доступа
  - vpn подключен, но ничего не открывается
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "форти не конектится"
  - "forticlient пишет ошибку подключения"
  - "впн постоянно отваливается"
  - "удалёнка не пашет"
  - "удаленный доступ перестал работать"
  - "работаю из дома, внутренние ресурсы не открываются"
  - "туннель поднимается и сразу падает"
  - "впн подключен но ничего не открывается"
  - "openvpn не стартует"
  - "vpn пишет ошибка 809"
  - "с домашнего интернета не зайти в корпоративную сеть"
  - "из командировки не могу подключиться к работе"
  - "впн просит сертификат"
  - "фортиклиент висит на 40 процентах"
  - "удаленка не подключается"
  - "не работает vpn после обновления"
  - "из дома к серверам не достучаться"
symptoms_hints:
  VPN не подключается: [не подключается, не коннектится, не соединяет, не могу подключиться]
  VPN постоянно отключается: [отваливается, разрывается, отключается, отваливает]
  ошибка аутентификации VPN: [authentication failed, неверный логин, ошибка аутентификац, login failed]
questions:
  - fact: error_text
    text: Какую ошибку показывает VPN-клиент при подключении?
    kind: text
  - fact: internet_works
    text: Без VPN интернет работает — сайты вроде yandex.ru открываются?
    kind: yes_no
steps:
  - id: check_internet
    title: Проверьте интернет
    instruction: Перезагрузите домашний роутер (выключите на 30 секунд) или подключитесь к другой сети, например к раздаче с телефона. Затем снова включите VPN.
    when: {internet_works: ["no"]}
  - id: restart_vpn_client
    title: Перезапустите VPN-клиент
    instruction: Полностью закройте VPN-клиент (правый клик по значку в трее → «Выход»), подождите 10 секунд, запустите его снова и подключитесь.
  - id: check_vpn_credentials
    title: Проверьте логин и пароль VPN
    instruction: VPN использует ваш корпоративный логин и пароль. Если недавно меняли пароль — введите новый. Проверьте, что логин указан в формате имя@компания.
  - id: switch_vpn_server
    title: Выберите другой сервер VPN
    instruction: В поле адреса сервера в VPN-клиенте выберите резервный сервер из списка (обычно «vpn2» или «Backup») и подключитесь снова.
  - id: reboot_computer
    title: Перезагрузите компьютер
    instruction: Сохраните работу и перезагрузите компьютер через «Пуск» → «Перезагрузка». После загрузки подключите VPN первым делом.
verify_question: VPN подключился, и рабочие системы открываются?
