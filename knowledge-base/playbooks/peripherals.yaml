# Клавиатура, мышь, тачпад, монитор, док-станция: всё, что подключено к компьютеру.
id: peripherals
title: Не работает клавиатура, мышь или монитор
service: Периферия
default_urgency: medium
escalation_team: Service Desk L1 (оргтехника)
keywords: [мышь, мышк, мыши, курсор, тачпад, клавиатур, клава, клаву, клавиш, западает, залипает, монитор, второй экран, второй монитор, внешний монитор, док-станц, докстанц, раскладк, русские буквы, английские буквы, флешк, usb, не видит монитор, не видит флешк, не видит мышь]
examples:
  - левая кнопка мыши не нажимается
  - стрелка на экране застыла, хотя компьютер работает
  - при нажатии на клавиши ничего не набирается
  - залипает клавиша
  - не работает тачпад на ноутбуке
  - монитор не загорается после выходных
  - на мониторе нет сигнала
  - ноутбук не видит экран, подключённый по hdmi
  - изображение на мониторе мерцает
  - через док-станцию не работают мониторы и мышь
  - беспроводная мышь перестала слушаться
  - клавиатура не переключается на русский
  - на экране ноутбука есть картинка, а на мониторе нет
  - мышка тормозит и курсор залипает
  - после переезда на другое место не работает монитор
  - usb клавиатура не определяется
symptoms_hints:
  мышь или тачпад: [мыш, курсор, тачпад]
  клавиатура: [клавиатур, клава, клаву, клавиш, западает, залипает]
  раскладка: [раскладк, русские буквы, английские буквы, на русский, на английский]
  монитор: [монитор, экран, изображени, сигнал, картинк]
  док-станция: [док-станц, докстанц]
questions:
  # Wired or wireless changes the first step for a mouse or keyboard.
  - fact: connection
    text: Мышь или клавиатура подключены проводом или беспроводные?
    why: "У беспроводной мыши чаще всего садится батарейка, у проводной — порт или кабель."
    kind: choice
    when_symptoms: [мышь или тачпад, клавиатура]
    unless_symptoms: [раскладка, док-станция]
    options:
      wired: [провод, кабел, usb, шнур]
      wireless: [беспровод, bluetooth, блютуз, радио, без провода]
    option_labels:
      wired: Проводом
      wireless: Беспроводные
steps:
  - id: switch_keyboard_layout
    title: Переключите раскладку
    instruction: "Windows: нажмите Win+Пробел (или Alt+Shift) и посмотрите на значок языка у часов — должно появиться «РУС». macOS: Ctrl+Пробел, значок языка в строке меню вверху. Если нужного языка в списке нет — нажмите «Не помогло»."
    when_symptoms: [раскладка]
  - id: replug_wired_device
    title: Переподключите кабель
    instruction: Выньте кабель мыши или клавиатуры из компьютера и вставьте в другой USB-разъём, лучше прямо в компьютер, а не в переходник. Подождите 10 секунд — устройство должно заработать.
    when: {connection: [wired]}
  - id: wireless_batteries
    title: Замените батарейки и включите устройство заново
    instruction: Выключите мышь или клавиатуру переключателем снизу, замените батарейки или поставьте на зарядку, включите снова. Проверьте, что маленький приёмник вставлен в USB-разъём; если устройство по Bluetooth — выключите и включите Bluetooth на компьютере. Устройство должно заработать через несколько секунд.
    when: {connection: [wireless]}
  - id: check_monitor_cable
    title: Проверьте питание и кабель монитора
    instruction: У монитора должен гореть индикатор питания — если не горит, нажмите кнопку включения и проверьте вилку. Проверьте, что кабель изображения плотно вставлен с двух сторон. Кнопкой «Input» или «Источник» на мониторе выберите нужный вход — картинка должна появиться.
    when_symptoms: [монитор, док-станция]
  - id: display_mode
    title: Включите второй экран в настройках
    instruction: "Windows: нажмите Win+P и выберите «Расширить». macOS: «Системные настройки» → «Мониторы» → «Определить мониторы». Изображение должно появиться на втором экране."
    when_symptoms: [монитор]
  - id: reconnect_dock
    title: Переподключите док-станцию
    instruction: Выньте кабель док-станции из ноутбука, подождите 10 секунд и вставьте снова; проверьте, что у док-станции горит индикатор питания. Мониторы и мышь должны заработать через полминуты.
    when_symptoms: [док-станция]
  - id: restart_for_device
    title: Перезагрузите компьютер
    instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка». macOS: меню Apple → «Перезагрузить». После включения проверьте устройство — оно должно заработать."
  - id: use_builtin_devices
    title: Поработайте на встроенных клавиатуре и экране
    instruction: Если у вас ноутбук, пока можно работать на его клавиатуре, тачпаде и экране. Если так работать получается — вы не выпадете из работы, а устройство проверит или заменит специалист.
    workaround: true
escalation_note: Если устройство неисправно, специалист заменит его — старое пригодится для проверки.
verify_question: Устройство работает как нужно?
