steps:
  - id: software_catalog
    title: Поищите программу в каталоге компании
    instruction: "Windows: «Пуск» → найдите «Центр программного обеспечения» (Software Center). macOS: откройте программу «Self Service». Найдите нужную программу и нажмите «Установить» — она поставится сама, без прав администратора. Если программы в каталоге нет — нажмите «Не помогло»."
    unless_symptoms: [нужна лицензия]
verify_question: Программа установилась и работает?
