id: password_login
title: Проблема со входом в учётную запись или паролем
service: Учётная запись
default_urgency: medium
escalation_team: Service Desk L2 (учётные записи)
keywords: [пароль, парол, учётн запис, учетн запис, логин, заблокир, истёк, истек, неверный пароль, забыл, сменить пароль, двухфактор, 2fa, код подтвержд, windows не пускает, не могу войти в систему, не могу войти в компьютер]
examples:
  - забыл пароль
  - пароль не подходит
  - учётная запись заблокирована
  - срок действия пароля истёк
  - не приходит код подтверждения при входе
  - windows не пускает, неверный пароль
  - просит сменить пароль, а новый не принимает
  - не могу войти в компьютер
symptoms_hints:
  неверный пароль: [неверный пароль, неправильный пароль, пароль не подходит, не принимает пароль]
  учётная запись заблокирована: [заблокир, блокировк, locked]
  срок пароля истёк: [истёк, истек, expired, срок действия]
  не приходит код подтверждения: [не приходит код, нет кода, код не приходит, sms не]
  пароль забыт: [забыл, забыла, не помню пароль]
questions:
  # Only when the symptom is unclear: the steps depend on it.
  - fact: error_text
    text: Что именно пишет система при входе? Например, «неверный пароль» или «учётная запись заблокирована».
    kind: text
    only_without_symptoms: true
  # Matters for lockouts (a phone retrying the old password), not for a forgotten one.
  - fact: password_changed_recently
    text: Вы недавно меняли пароль?
    kind: yes_no
    unless_symptoms: [пароль забыт]
steps:
  - id: check_keyboard_layout
    title: Проверьте раскладку и Caps Lock
    instruction: "Посмотрите на значок языка рядом с часами (на Mac — в строке меню вверху): нужна английская раскладка. Если на клавиатуре горит Caps Lock — нажмите его, чтобы погас. Введите пароль медленно, не копируя. Если снова «неверный пароль» — нажмите «Не помогло»."
    unless_symptoms: [пароль забыт]
  - id: check_phone_sms
    title: Запросите код ещё раз
    instruction: "Проверьте, что на телефоне есть связь. На странице входа нажмите «Отправить код ещё раз» и подождите 2 минуты. Если код так и не пришёл — нажмите «Не помогло»: специалист проверит номер телефона в учётной записи."
    when_symptoms: [не приходит код подтверждения]
  - id: self_service_reset
    title: Сбросьте пароль сами
    instruction: На странице входа нажмите «Забыли пароль?», подтвердите себя кодом из SMS и придумайте новый пароль. Должно появиться сообщение, что пароль изменён, — войдите с новым паролем.
    unless: {account_locked: ["yes"]}
    unless_symptoms: [не приходит код подтверждения]
  - id: wait_lockout
    title: Подождите 15 минут и войдите один раз
    instruction: После нескольких неверных попыток вход блокируется на 15 минут, и каждая новая попытка продлевает блокировку. Не вводите пароль 15 минут, затем введите его один раз, внимательно. Если снова пишет «заблокирована» — нажмите «Не помогло».
    when: {account_locked: ["yes"]}
  - id: update_password_on_devices
    title: Введите новый пароль на телефоне
    instruction: Если вы недавно меняли пароль, телефон может проверять почту со старым и снова блокировать учётную запись. Откройте на телефоне рабочую почту и Teams и введите новый пароль, когда попросят. Если не просят — выйдите из рабочей почты на телефоне. После этого блокировки должны прекратиться.
    when: {password_changed_recently: ["yes"]}
  - id: unlock_account
    title: Разблокировка учётной записи
    instruction: Снять блокировку учётной записи в каталоге и проверить, с какого устройства идут неверные попытки входа.
    when: {account_locked: ["yes"]}
    requires_admin: true
verify_question: Получилось войти в учётную запись с новым или текущим паролем?
