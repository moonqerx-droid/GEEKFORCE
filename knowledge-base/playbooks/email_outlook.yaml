id: email_outlook
title: Проблема с корпоративной почтой
service: Почта
default_urgency: medium
escalation_team: Администраторы почты
keywords: [почт, outlook, аутлук, письм, email, e-mail, mail, ящик, входящ, вложени, exchange, исходящ, не уходят письма, письма не уходят]
examples:
  - outlook не отправляет письма
  - письма не приходят
  - почта не синхронизируется
  - письма висят в исходящих
  - outlook постоянно просит пароль
  - не открывается почта
  - ящик переполнен
  - не могу отправить письмо с большим вложением
  - аутлук вылетает при запуске
  - почта на телефоне не обновляется
symptoms_hints:
  письма не отправляются: [не отправляется, не уходит, не уходят, не отправляются, застряло в исходящих, застряли в исходящих, висят в исходящих]
  письма не приходят: [не приходят, не получаю, нет новых писем]
  Outlook не запускается: [не запускается, outlook не открывается, вылетает, зависает]
  почта не синхронизируется: [не синхрониз, не обновляется, не подтягивает]
  ящик переполнен: [переполнен, закончилось место, превышен размер, квота]
  запрашивает пароль: [запрашивает пароль, просит пароль, постоянно спрашивает пароль]
questions:
  - fact: mail_client
    text: Где вы работаете с почтой — в программе Outlook или в браузере?
    kind: choice
    options:
      outlook: [outlook, аутлук, программ, приложени]
      web: [браузер, веб, owa, сайт]
    option_labels:
      outlook: В программе Outlook
      web: В браузере
  - fact: error_text
    text: Есть ли сообщение об ошибке? Если да — что в нём написано?
    kind: text
steps:
  - id: check_web_mail
    title: Откройте почту в браузере
    instruction: "Откройте в браузере веб-почту (Outlook Web, адрес есть на портале компании) и войдите рабочим логином. Если там письма видны и отправляются — работайте пока в браузере: ящик в порядке, дело в программе на компьютере."
    when: {mail_client: [outlook]}
    workaround: true
  - id: restart_outlook
    title: Перезапустите Outlook полностью
    instruction: "Закройте Outlook и подождите 10 секунд. Windows: если он не закрывается, нажмите Ctrl+Shift+Esc, выберите Outlook в списке → «Снять задачу». macOS: правой кнопкой по значку Outlook в Dock → «Завершить». Откройте Outlook снова — письма должны начать загружаться."
    when: {mail_client: [outlook]}
  - id: check_mailbox_size
    title: Освободите место в ящике
    instruction: Нажмите правой кнопкой на папку «Удалённые» → «Очистить папку», то же с «Нежелательной почтой». Удалите старые письма с большими вложениями. Заполненность ящика видна внизу окна почты — когда место появится, письма снова начнут уходить и приходить.
    when_symptoms: [ящик переполнен, письма не отправляются, письма не приходят, почта не синхронизируется]
  - id: outlook_safe_mode
    title: Запустите Outlook без дополнений
    instruction: "Закройте Outlook. Windows: нажмите Win+R, впишите outlook /safe и нажмите Enter — Outlook откроется в безопасном режиме. Если в нём почта работает, мешает дополнение — нажмите «Не помогло», специалист его отключит. На Mac такого режима нет — нажмите «Не могу выполнить»."
    when: {mail_client: [outlook]}
  - id: clear_browser_cache_mail
    title: Удалите сохранённые данные сайта почты
    instruction: "В браузере нажмите на значок замка слева от адреса почты → «Настройки сайта» → «Удалить данные» (в Safari: «Настройки» → «Конфиденциальность» → «Управлять данными сайтов»). Удаляйте только сайт почты. Войдите заново — почта должна открыться."
    when: {mail_client: [web]}
verify_question: Почта работает — письма отправляются и приходят?
