id: network_wifi
title: Нет интернета или проблемы с Wi-Fi
service: Сеть
default_urgency: medium
escalation_team: Сетевые администраторы
keywords: [wi-fi, wifi, вай-фай, вайфай, вай фай, интернет, сеть, сетев, роутер, кабель, нет подключения, без доступа к интернету, пинг, не видит сеть, не видит wifi, не видит вайфай]
examples:
  - нет интернета
  - wi-fi постоянно отваливается
  - вайфай подключен, но сайты не открываются
  - интернет очень медленный
  - не могу подключиться к wi-fi в офисе
  - пропадает сеть на ноутбуке
  - кабель воткнут, а интернета нет
  - без доступа к интернету пишет
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "не работает интернет"
  - "вайфай не подключается"
  - "wi-fi без доступа к интернету"
  - "инет тормозит"
  - "сеть постоянно отваливается"
  - "по кабелю нет сети"
  - "страницы не открываются, интернета нет"
  - "роутер мигает, интернета нет"
  - "вай фай ловит плохо в переговорке"
  - "низкая скорость интернета"
  - "пинг огромный, всё лагает"
  - "сайты грузятся очень долго"
  - "нет подключения к сети"
  - "инета нет"
  - "интирнет не работает"
  - "вайфай то есть, то нет"
  - "ноут не цепляется к офисной сети"
  - "сетевой кабель подключен, но интернета нет"
  - "wifi подключается и сразу отключается"
symptoms_hints:
  нет подключения к интернету: [нет интернета, нет подключения, без доступа к интернету, не работает интернет, интернет не работает]
  Wi-Fi не видит сеть: [не видит сеть, не находит сеть, нет сети в списке]
  медленная сеть: [медленно, тормозит, долго грузит, низкая скорость]
  частые разрывы: [отваливается, отваливаться, пропадает, разрывается, рвется, рвётся]
  интернет пропал: [интернет пропал, пропал интернет, отключился интернет]
questions:
  - fact: location
    text: Вы сейчас в офисе или работаете из дома?
    why: "В офисе и дома интернет чинится по-разному: офисную сеть проверяем мы, домашнюю — вы."
    kind: choice
    options:
      office: [офис, на работе]
      remote: [дом, дома, удалён, удален, кафе, коворкинг]
    option_labels:
      office: В офисе
      remote: Дома или в другом месте
  - fact: colleagues_affected
    text: У коллег рядом интернет работает нормально?
    why: "Если не работает у всех — это общий сбой, и проверять что-то у себя не нужно."
    kind: yes_no
    # "да, у коллег работает" means the problem is local -> colleagues_affected=no
    invert: true
    # At home there are no colleagues nearby to compare with.
    when_facts: {location: [office]}
steps:
  - id: toggle_wifi
    title: Выключите и включите Wi-Fi
    instruction: "Windows: нажмите на значок сети рядом с часами, выключите Wi-Fi, через 10 секунд включите. macOS: значок Wi-Fi в строке меню вверху → выключить и включить. Подключитесь к рабочей сети — сайты должны открыться."
  - id: restart_home_router
    title: Перезагрузите роутер
    instruction: Выньте вилку роутера из розетки на 30 секунд и включите обратно. Через 2 минуты, когда индикаторы перестанут мигать, откройте любой сайт — он должен загрузиться.
    when: {location: [remote]}
  - id: forget_network
    title: Подключитесь к сети заново
    instruction: "Windows: «Параметры» → «Сеть и Интернет» → «Wi-Fi» → «Управление известными сетями» → выберите сеть → «Забыть». macOS: «Системные настройки» → «Wi-Fi» → «…» у сети → «Забыть». Подключитесь снова с паролем от Wi-Fi — сайты должны открыться. Если пароля не знаете — нажмите «Не могу выполнить»."
    unless: {location: [office]}
  - id: run_network_troubleshooter
    title: Запустите проверку сети
    instruction: "Windows: правой кнопкой по значку сети рядом с часами → «Диагностика неполадок», выполните, что предложит мастер. macOS: удерживая Option, нажмите на значок Wi-Fi → «Открыть Беспроводную диагностику». Если мастер пишет, что исправил проблему, — проверьте сайты."
  - id: reset_network_stack
    title: Сброс сетевых настроек компьютера
    instruction: ipconfig /release, ipconfig /renew, ipconfig /flushdns; проверить драйвер сетевой карты и профиль корпоративной сети.
    requires_admin: true
  - id: phone_hotspot
    title: Подключитесь к интернету с телефона
    instruction: "Включите на телефоне раздачу интернета: «Режим модема» на iPhone или «Точка доступа» на Android, и подключите к ней ноутбук по Wi-Fi. Если сайты открылись — поработайте так, а с основной сетью разберёмся дальше."
    workaround: true
verify_question: Интернет заработал — сайты и рабочие системы открываются?
