id: network_wifi
title: Нет интернета или проблемы с Wi-Fi
service: Сеть
default_urgency: medium
escalation_team: Сетевые администраторы
keywords: [wi-fi, wifi, вай-фай, вайфай, вай фай, интернет, сеть, сетев, роутер, кабель, нет подключения, без доступа к интернету, пинг]
examples:
  - нет интернета
  - wi-fi постоянно отваливается
  - вайфай подключен, но сайты не открываются
  - интернет очень медленный
  - не могу подключиться к wi-fi в офисе
  - пропадает сеть на ноутбуке
  - кабель воткнут, а интернета нет
  - без доступа к интернету пишет
symptoms_hints:
  нет подключения к интернету: [нет интернета, нет подключения, без доступа к интернету, не работает интернет, интернет не работает]
  Wi-Fi не видит сеть: [не видит сеть, не находит сеть, нет сети в списке]
  медленная сеть: [медленно, тормозит, долго грузит, низкая скорость]
  частые разрывы: [отваливается, отваливаться, пропадает, разрывается, рвется, рвётся]
  интернет пропал: [интернет пропал, пропал интернет, отключился интернет]
questions:
  - fact: location
    text: Вы сейчас в офисе или работаете из дома?
    kind: choice
    options:
      office: [офис, на работе]
      remote: [дом, дома, удалён, удален, кафе, коворкинг]
    option_labels:
      office: В офисе
      remote: Дома или в другом месте
  - fact: colleagues_affected
    text: У коллег рядом интернет работает нормально?
    kind: yes_no
    # "да, у коллег работает" means the problem is local -> colleagues_affected=no
    invert: true
steps:
  - id: toggle_wifi
    title: Переподключите Wi-Fi
    instruction: Нажмите на значок сети в правом нижнем углу, выключите Wi-Fi, подождите 10 секунд и включите снова. Подключитесь к корпоративной сети.
  - id: forget_network
    title: Забудьте сеть и подключитесь заново
    instruction: "Параметры → Сеть и Интернет → Wi-Fi → Управление известными сетями → выберите сеть → «Забыть». Затем подключитесь снова и введите данные для входа."
  - id: restart_home_router
    title: Перезагрузите роутер
    instruction: Выключите домашний роутер из розетки на 30 секунд и включите обратно. Подождите 2 минуты, пока загорятся индикаторы.
    when: {location: ["remote"]}
  - id: run_network_troubleshooter
    title: Запустите диагностику сети
    instruction: Правый клик по значку сети → «Диагностика неполадок». Выполните предложенные Windows исправления.
  - id: reset_network_stack
    title: Сбросьте сетевые настройки
    instruction: "Нажмите Win+R, введите cmd, нажмите Enter и выполните по очереди: ipconfig /release, ipconfig /renew, ipconfig /flushdns."
  - id: phone_hotspot
    title: Подключитесь к раздаче с телефона
    instruction: Включите на телефоне режим модема (точку доступа) и подключите к нему ноутбук через Wi-Fi. Этого хватит на почту и звонок, пока разбираемся с основной сетью.
    workaround: true
verify_question: Интернет заработал — сайты и рабочие системы открываются?
