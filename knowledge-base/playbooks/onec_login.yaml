# Вход в 1С: лицензии, зависшие сеансы, пароль пользователя 1С, пропавшая база.
# Не путать с «1С тормозит» (slow_performance) и «сервер 1С недоступен» (service_unavailable).
id: onec_login
title: Не получается войти в 1С
service: 1С
default_urgency: medium
escalation_team: Администраторы 1С
keywords: [нет свободной лицензии, свободной лицензии, лицензи 1с, 1с лицензи, войти в 1с, зайти в 1с, вход в 1с, входе в 1с, 1с не пускает, не пускает в 1с, пользователь уже авторизован, уже авторизован, сеанс уже, список баз, списке баз, информационн баз, пользователей 1с, зуп, 1с бухгалтери]
examples:
  - 1с не пускает
  - не получается авторизоваться в 1с
  - лимит подключений к 1с исчерпан
  - 1с говорит что превышено число пользователей
  - все лицензии 1с заняты
  - 1с говорит пользователь с таким именем уже авторизован
  - 1с ругается что сеанс уже запущен
  - в списке информационных баз пусто
  - пропала база в окне запуска 1с
  - 1с не принимает пароль
  - забыл пароль от своей 1с
  - новому сотруднику не завели учётку в 1с
  - бухгалтерия 1с не даёт авторизоваться
  - в зуп не пускает
  - 1с упр не открывается, пишет ошибка авторизации
  - после смены компьютера нет базы 1с
  - 1с выкинуло и больше не пускает
symptoms_hints:
  нет свободной лицензии: [лицензи]
  сеанс уже открыт: [уже авторизован, сеанс уже, уже запущен, уже открыт, уже в системе]
  неверный пароль 1С: [неправильн, неверн, не принимает пароль, пароль не подходит, забыл пароль, ошибка авторизации]
  нет базы в списке: [список баз, списке баз, нет базы, нет нашей базы, базы нет, пропала база, информационн баз]
  нет пользователя в 1С: [пользователь не найден, нет среди пользователей, нет в списке пользователей, списке пользователей]
questions:
  # Only when it is unclear what 1С says: every symptom has its own path.
  - fact: error_text
    text: Что пишет 1С при входе? Например, «нет свободной лицензии», «неправильное имя пользователя» или «нет базы в списке».
    kind: text
    only_without_symptoms: true
steps:
  - id: close_1c_everywhere
    title: Закройте 1С на всех устройствах
    instruction: Если 1С открыта у вас где-то ещё — на другом компьютере, в браузере или в удалённом рабочем столе, — закройте её там. Подождите 5 минут и запустите 1С снова. Лицензия или зависший сеанс должны освободиться.
    when_symptoms: [нет свободной лицензии, сеанс уже открыт]
  - id: check_1c_user_and_password
    title: Проверьте пользователя и раскладку
    instruction: В окне входа 1С проверьте, что в поле «Пользователь» выбрано ваше имя. Посмотрите на значок языка у часов и на Caps Lock, введите пароль медленно. Если снова пишет «неправильное имя пользователя или пароль» — нажмите «Не помогло».
    when_symptoms: [неверный пароль 1С]
  - id: release_1c_license
    title: Освобождение лицензий 1С на сервере
    instruction: Проверить занятые лицензии и зависшие сеансы в консоли кластера 1С, завершить зависшие.
    when_symptoms: [нет свободной лицензии, сеанс уже открыт]
    requires_admin: true
  - id: reset_1c_password
    title: Сброс пароля пользователя 1С
    instruction: Сбросить пароль пользователя в конфигураторе 1С или проверить доменную авторизацию.
    when_symptoms: [неверный пароль 1С]
    requires_admin: true
  - id: add_1c_base
    title: Подключение базы 1С к списку
    instruction: Добавить информационную базу в список запуска на компьютере сотрудника (путь к серверу и имя базы).
    when_symptoms: [нет базы в списке]
    requires_admin: true
  - id: add_1c_user
    title: Добавление пользователя в базу 1С
    instruction: Проверить, что сотрудник заведён в базе и у него есть нужные роли.
    when_symptoms: [нет пользователя в 1С]
    requires_admin: true
verify_question: Получилось войти в 1С?
