id: security_incident
title: Подозрение на инцидент информационной безопасности
service: Информационная безопасность
default_urgency: critical
escalation_team: Отдел информационной безопасности
escalate_immediately: true
keywords: [фишинг, подозрительн письм, подозрительн ссылк, перешёл по ссылке, перешел по ссылке, вирус, шифровальщик, зашифрован, взлом, взломал, утечк, вредонос, антивирус ругается, кто-то зашёл, кто-то зашел, ввёл пароль на сайте, ввел пароль на сайте, ввёл пароль на подозрительн, ввел пароль на подозрительн, ввела пароль на подозрительн, подозрительн сайт, фишингов, странное письмо, архив с паролем, запароленн архив, архив и пароль, защитник windows, угроз, выкуп, вымогат, требуют деньги, требуют оплат]
examples:
  - перешёл по ссылке из странного письма и ввёл пароль
  - антивирус нашёл вирус
  - файлы зашифрованы, требуют выкуп
  - пришло подозрительное письмо от банка
  - кто-то зашёл в мою учётную запись
  - открыл вложение из непонятного письма
  - похоже, мой компьютер взломали
  - ввёл данные на подозрительном сайте
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "пришло подозрительное письмо"
  - "фишинговое письмо"
  - "перешёл по ссылке из письма"
  - "открыл вложение из подозрительного письма"
  - "файлы зашифрованы"
  - "шифровальщик"
  - "кто-то зашёл в мою почту"
  - "мою учётку взломали"
  - "подозрительная ссылка в письме от директора"
  - "письмо с просьбой срочно оплатить счёт, похоже на мошенников"
  - "скачал файл, а теперь комп странно себя ведёт"
  - "антивирус ругается"
  - "подозрительный вход в учётную запись"
  - "утечка данных"
  - "открыла архив из странного письма"
  - "подазрительная ссылка"
  - "вирус на компе"
  - "мне пришло письмо якобы от банка, я ввёл данные"
symptoms_hints:
  подозрительное письмо или ссылка: [фишинг, подозрительн письм, подозрительн ссылк, перешёл по ссылке, перешел по ссылке, странное письмо]
  признаки вредоносной программы: [вирус, шифровальщик, зашифрован, вредонос, антивирус]
  возможная компрометация учётной записи: [взлом, кто-то зашёл, кто-то зашел, ввёл пароль, ввел пароль]
questions:
  - fact: entered_credentials
    text: Вы вводили пароль или другие данные после перехода по ссылке или открытия файла?
    why: "Если пароль уже введён, его нужно сменить немедленно — это меняет срочность."
    kind: yes_no
steps: []
safety_notice: Отключите компьютер от сети (Wi-Fi и кабель), но не выключайте его и ничего не удаляйте — это поможет специалистам.
verify_question: Специалист по безопасности связался с вами?
