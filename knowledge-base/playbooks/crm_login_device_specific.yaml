# id сохранён из PROJECT_PLAN.md; сценарий покрывает вход в любую рабочую
# систему (CRM, «рабочая система» из примера кейса), когда не пускает с одного устройства.
id: crm_login_device_specific
title: Не удаётся войти в рабочую систему
service: Рабочая система
default_urgency: medium
escalation_team: Администраторы прикладных систем
keywords: [crm, црм, срм, битрикс, bitrix, amocrm, salesforce, клиентск база, карточк клиент, сделк, рабочую систему, рабочая система, рабочей системе, рабочей системы, через телефон открывается, через телефон работает, с телефона открывается, с телефона работает, на телефоне работает, с ноутбука нет, с ноутбука не]
examples:
  - в crm не могу войти с ноутбука, а с телефона работает
  - рабочая система не открывается на компьютере, на телефоне всё нормально
  - не пускает в битрикс с рабочего компа
  - на ноутбуке не заходит в клиентскую базу, у коллеги работает
  - вчера всё работало, сегодня не могу зайти в систему с ноутбука
  - в amocrm не входит только на этом компьютере
  - с телефона в систему захожу, с ноута нет
symptoms_hints:
  не удаётся войти: [не могу войти, не входит, не пускает, не заходит, не могу зайти, не логинит, вход не]
  не открывается страница: [не открывается, не грузится, белый экран, бесконечно грузится]
  работает на другом устройстве: [с телефона работает, на телефоне работает, с телефона всё, с телефона норм, на телефоне норм, с телефона открывается, через телефон открывается, через телефон работает, с другого компьютера работает]
questions:
  - fact: error_text
    text: Что появляется на ноутбуке, когда пытаетесь войти? Можно своими словами или «ничего не происходит».
    kind: text
  - fact: vpn
    text: Вы сейчас подключены к корпоративному VPN?
    kind: yes_no
  - fact: other_device_works
    text: С другого устройства (например, телефона) система открывается?
    kind: yes_no
steps:
  - id: connect_vpn
    title: Подключитесь к VPN
    instruction: Подключитесь к корпоративному VPN (значок в трее, «Подключить»), дождитесь статуса «Подключено» и снова откройте систему.
    when: {vpn: ["no"]}
  - id: clear_crm_cookies
    title: Очистите cookies и кэш браузера
    instruction: "Сохраните незавершённую работу в CRM. Откройте настройки браузера → данные сайтов, найдите адрес CRM и удалите данные только этого сайта. Пароли и данные остальных сайтов удалять не нужно. Откройте CRM и войдите заново."
  - id: try_private_window
    title: Откройте систему в режиме инкогнито
    instruction: Откройте меню браузера → новое приватное окно (инкогнито), откройте в этом окне адрес системы и попробуйте войти. Так расширения и старые данные браузера не мешают входу.
  - id: try_other_browser
    title: Попробуйте другой браузер
    instruction: Откройте систему в другом браузере — например, в Edge, если обычно используете Chrome, или наоборот.
  - id: flush_dns
    title: Сбросьте сетевой кэш
    instruction: "Если у вас Windows: нажмите Win+R, введите cmd, нажмите Enter и выполните ipconfig /flushdns. Затем снова откройте систему. На macOS или если выполнить команду не получается, выберите «Не могу выполнить» — передадим контекст специалисту."
verify_question: Проверьте, пожалуйста — вы смогли войти в систему с ноутбука?
