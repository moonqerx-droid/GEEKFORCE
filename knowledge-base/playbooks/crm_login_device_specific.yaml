# id сохранён из исходного API-контракта; сценарий покрывает вход в любую рабочую
# систему (CRM, «рабочая система» из примера кейса), когда не пускает с одного устройства.
id: crm_login_device_specific
title: Не удаётся войти в рабочую систему
service: Рабочая система
default_urgency: medium
escalation_team: Администраторы прикладных систем
keywords: [crm, црм, срм, битрикс, bitrix, amocrm, salesforce, клиентск база, карточк клиент, сделк, рабочую систему, рабочая система, рабочей системе, рабочей системы, через телефон открывается, через телефон работает, с телефона открывается, с телефона работает, на телефоне работает, с ноутбука нет, с ноутбука не, салесфорс, амо, amo]
examples:
  - в crm не могу войти с ноутбука, а с телефона работает
  - рабочая система не открывается на компьютере, на телефоне всё нормально
  - не пускает в битрикс с рабочего компа
  - на ноутбуке не заходит в клиентскую базу, у коллеги работает
  - вчера всё работало, сегодня не могу зайти в систему с ноутбука
  - в amocrm не входит только на этом компьютере
  - с телефона в систему захожу, с ноута нет
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "не могу зайти в CRM с рабочего компьютера"
  - "с ноутбука не пускает в систему, а с телефона всё открывается"
  - "Салесфорс не открывается на ноутбуке"
  - "битрикс не грузится на компе, на мобиле работает"
  - "срм выкидывает на страницу входа"
  - "в црм не заходит, крутится загрузка"
  - "не открывается карточка клиента"
  - "сделки в CRM не загружаются"
  - "рабочая система не пускает с ноутбука"
  - "амо не открывается в браузере на ноуте"
  - "вчера заходил нормально, сегодня CRM не открывается"
  - "клиентская база не грузится, а у меня звонок с клиентом"
  - "с телефона в систему захожу, с компьютера нет"
  - "не логинит в crm"
  - "срм не пускаит"
  - "битрикс24 белый экран на ноутбуке"
  - "CRM пишет ошибка входа только на моём ноуте"
  - "не могу войти в систему продаж"
  - "в рабочую систему не зайти с компа, на планшете открывается"
  - "salesforce крутит бесконечную загрузку"
  - "клиентскую базу не открыть, а через телефон заходит"
  - "црм тупит и не пускает дальше логина"
symptoms_hints:
  не удаётся войти: [не могу войти, не входит, не пускает, не заходит, не могу зайти, не логинит, вход не]
  не открывается страница: [не открывается, не грузится, белый экран, бесконечно грузится]
  работает на другом устройстве: [с телефона работает, на телефоне работает, с телефона всё, с телефона норм, на телефоне норм, с телефона открывается, через телефон открывается, через телефон работает, с другого компьютера работает]
questions:
  - fact: error_text
    text: Что появляется на ноутбуке, когда пытаетесь войти? Можно своими словами или «ничего не происходит».
    kind: text
  - fact: vpn
    text: Вы сейчас подключены к корпоративному VPN?
    kind: yes_no
  - fact: other_device_works
    text: С другого устройства (например, телефона) система открывается?
    kind: yes_no
steps:
  - id: connect_vpn
    title: Подключитесь к VPN
    instruction: "Windows: значок VPN рядом с часами → «Подключить»; macOS: значок в строке меню вверху. Дождитесь статуса «Подключено» и снова откройте систему — должна появиться страница входа."
    when: {vpn: ["no"]}
  - id: clear_crm_cookies
    title: Удалите сохранённые данные сайта системы
    instruction: "Сохраните незавершённую работу. Нажмите на значок замка слева от адреса → «Настройки сайта» → «Удалить данные» (в Safari: «Настройки» → «Конфиденциальность» → «Управлять данными сайтов»). Удаляйте только этот сайт — пароли и другие сайты не трогайте. Войдите заново — вход должен пройти."
  - id: try_private_window
    title: Откройте систему в окне инкогнито
    instruction: Нажмите Ctrl+Shift+N (на Mac — Cmd+Shift+N), вставьте адрес системы и войдите. Если в этом окне вход работает — мешают старые данные браузера или расширения, работайте пока в нём.
  - id: try_other_browser
    title: Попробуйте другой браузер
    instruction: "Откройте систему в другом браузере: Edge, если обычно Chrome, или наоборот (на Mac — Safari). Если там вход проходит — работайте пока в нём."
  - id: flush_dns
    title: Сброс сетевого кэша компьютера
    instruction: ipconfig /flushdns, проверить прокси и сертификаты браузера, журнал входа в системе.
    requires_admin: true
verify_question: Проверьте, пожалуйста — вы смогли войти в систему с ноутбука?
