id: crm_login_device_specific
title: Не удаётся войти в CRM
service: CRM
default_urgency: medium
escalation_team: Администраторы CRM
keywords: [crm, црм, срм, битрикс, bitrix, amocrm, salesforce, клиентск база, карточк клиент, сделк]
symptoms_hints:
  не удаётся войти: [не могу войти, не входит, не пускает, не заходит, не могу зайти, не логинит, вход не]
  не открывается страница: [не открывается, не грузится, белый экран, бесконечно грузится]
  работает на другом устройстве: [с телефона работает, на телефоне работает, с телефона всё, с телефона норм, на телефоне норм, с другого компьютера работает]
questions:
  - fact: error_text
    text: Какое сообщение или ошибку вы видите при попытке входа? Можно своими словами.
    kind: text
  - fact: vpn
    text: Вы сейчас подключены к корпоративному VPN?
    kind: yes_no
  - fact: other_device_works
    text: С другого устройства (например, телефона) CRM открывается?
    kind: yes_no
steps:
  - id: connect_vpn
    title: Подключитесь к VPN
    instruction: Подключитесь к корпоративному VPN (значок в трее, «Подключить»), дождитесь статуса «Подключено» и снова откройте CRM.
    when: {vpn: ["no"]}
  - id: clear_crm_cookies
    title: Очистите cookies CRM
    instruction: "В браузере нажмите Ctrl+Shift+Delete, выберите «Файлы cookie» и «Кэш» за всё время, нажмите «Удалить данные», затем закройте браузер полностью и войдите в CRM заново."
  - id: try_private_window
    title: Откройте CRM в режиме инкогнито
    instruction: Нажмите Ctrl+Shift+N (Chrome/Edge), откройте в этом окне адрес CRM и попробуйте войти. Так расширения и старые данные браузера не мешают входу.
  - id: try_other_browser
    title: Попробуйте другой браузер
    instruction: Откройте CRM в другом браузере — например, в Edge, если обычно используете Chrome, или наоборот.
  - id: flush_dns
    title: Сбросьте сетевой кэш
    instruction: "Нажмите Win+R, введите cmd и нажмите Enter. В открывшемся окне выполните команду ipconfig /flushdns, затем снова откройте CRM."
verify_question: Проверьте, пожалуйста — вы смогли войти в CRM и открыть нужные данные?
