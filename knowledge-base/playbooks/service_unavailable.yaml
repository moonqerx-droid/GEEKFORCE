id: service_unavailable
title: Рабочий сервис недоступен
service: Корпоративный сервис
default_urgency: high
escalation_team: Дежурный инженер
keywords: ["502", "503", "504", "500", bad gateway, service unavailable, сервис недоступ, сайт недоступ, портал, сервер не отвечает, упал, лежит, 1с, 1c, jira, джира, confluence, конфлюенс, вики, wiki, интранет, внутренн сайт, корпоративн сайт, сайт компании]
examples:
  - портал выдаёт 502
  - сайт недоступен
  - 1с не запускается, сервер не отвечает
  - jira не открывается
  - корпоративный портал лежит
  - конфлюенс выдаёт ошибку 503
  - сервис упал
  - bad gateway при открытии системы
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "конфлюенс лежит"
  - "ошибка 502"
  - "503 service unavailable"
  - "504 gateway timeout на портале"
  - "сервис недоступен"
  - "сайт не отвечает"
  - "1с выдаёт ошибку подключения к серверу"
  - "внутренний сайт упал"
  - "джира не грузится"
  - "confluence выдаёт ошибку 500"
  - "не открывается корпоративный сайт"
  - "база 1с не запускается"
  - "портал висит на загрузке"
  - "портал лежит"
  - "сервис не открывается уже полчаса"
  - "не работает внутренняя система заявок"
  - "wiki недоступна"
symptoms_hints:
  ошибка сервера 5xx: ["502", "503", "504", "500", bad gateway, service unavailable, internal server error]
  сервис не отвечает: [не отвечает, не открывается, недоступ, упал, лежит]
questions:
  - fact: colleagues_affected
    text: У коллег этот сервис тоже не открывается?
    kind: yes_no
  - fact: error_text
    text: Что показывается на экране вместо сервиса? Например, «502 Bad Gateway».
    kind: text
steps:
  - id: hard_refresh
    title: Обновите страницу полностью
    instruction: "Нажмите Ctrl+F5 (на Mac — Cmd+Shift+R): страница загрузится заново, без сохранённых копий. Если открылась — всё в порядке; если та же ошибка, подождите минуту и попробуйте ещё раз."
  - id: check_other_services
    title: Проверьте другие сайты
    instruction: "Откройте другой рабочий сайт, например почту в браузере. Если не открывается ничего — дело в интернете, а не в этом сервисе: напишите об этом, и займёмся сетью."
  - id: try_private_window_service
    title: Откройте сервис в окне инкогнито
    instruction: "Нажмите Ctrl+Shift+N (в Safari — Cmd+Shift+N), вставьте адрес сервиса и откройте. Если в этом окне сервис открылся — работайте пока в нём: мешают сохранённые данные обычного окна."
    unless: {colleagues_affected: ["yes"]}
verify_question: Сервис снова открывается и работает?
