id: video_calls
title: Проблемы с видеозвонком
service: Видеосвязь
default_urgency: medium
escalation_team: Service Desk L2 (рабочие места)
keywords: [zoom, зум, teams, тимс, телемост, видеозвон, видеоконфер, созвон, звонок, микрофон, камер, наушник, гарнитур, не слышат, не слышу, не видят, звук, конференц]
examples:
  - меня не слышат в zoom
  - нет звука на созвоне
  - камера не включается в teams
  - не видят мой экран на конференции
  - микрофон не работает на звонке
  - гарнитура не подключается к телемосту
  - видеозвонок не запускается
  - собеседники меня не видят
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "не слышу собеседника"
  - "в телемосте пропадает звук"
  - "зум не запускается"
  - "тимс вылетает на звонке"
  - "наушники не работают в зуме"
  - "гарнитура не определяется"
  - "видео зависает на конференции"
  - "меня не видят на созвоне"
  - "звук эхом на видеоконференции"
  - "не могу подключиться к встрече в тимс"
  - "демонстрация экрана не работает"
  - "звонок в teams обрывается"
  - "микрафон не работает"
  - "камеру не видит зум"
  - "собеседники слышат меня с роботизированным звуком"
  - "на видеозвонке всё тормозит"
  - "в зуме чёрный экран вместо видео"
  - "телемост не видит камеру"
  - "созвон через пять минут, а микрофон молчит"
symptoms_hints:
  собеседники не слышат: [меня не слышат, не слышат меня, микрофон не работает, не работает микрофон]
  не слышно собеседников: [не слышу собеседник, не слышу коллег, не слышу никого, не слышу их, не слышно собеседник, не слышно коллег, нет звука, пропал звук]
  камера не работает: [камера не, не видят меня, черный экран камеры, чёрный экран камеры, не работает камера]
  звонок прерывается: [прерывается, лагает, заикается, зависает видео]
  приложение не запускается: [не запуска, не открывается, не открывает, вылетает, не стартует, не включается, не грузится]
questions:
  # Steps differ by symptom, so without one we ask what exactly is wrong.
  - fact: call_problem
    text: Что именно не так со звонком — вас не слышно, вы не слышите собеседников, не работает камера или программа не запускается?
    kind: text
    only_without_symptoms: true
  # Only the audio steps depend on the headset.
  - fact: headset
    text: Вы используете наушники или гарнитуру?
    kind: yes_no
    when_symptoms: [собеседники не слышат, не слышно собеседников, звонок прерывается]
steps:
  - id: restart_call_app
    title: Закройте программу звонков полностью и откройте снова
    instruction: "Windows: нажмите Ctrl+Shift+Esc, выберите Teams или Zoom в списке → «Снять задачу». macOS: правой кнопкой по значку в Dock → «Завершить принудительно». Откройте программу снова — должно появиться окно входа или список встреч."
    when_symptoms: [приложение не запускается]
  - id: reboot_for_call_app
    title: Перезагрузите компьютер
    instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка». macOS: меню Apple → «Перезагрузить». После включения первой откройте программу звонков — она должна запуститься."
    when_symptoms: [приложение не запускается]
  - id: check_mute_and_device
    title: Выберите правильный микрофон и камеру
    instruction: В окне звонка нажмите стрелку рядом со значком микрофона (или камеры) и выберите нужное устройство, например вашу гарнитуру. Значок микрофона не должен быть перечёркнут. Скажите что-нибудь — полоска громкости должна двигаться.
    unless_symptoms: [приложение не запускается]
  - id: reconnect_headset
    title: Переподключите гарнитуру
    instruction: Выньте штекер или USB гарнитуры и вставьте снова; если она по Bluetooth — выключите и включите её. Затем выберите её в звонке (стрелка рядом с микрофоном). Если гарнитуры нет в списке — нажмите «Не помогло».
    when: {headset: ["yes"]}
    unless_symptoms: [приложение не запускается]
  - id: check_privacy_permissions
    title: Разрешите доступ к микрофону и камере
    instruction: "Windows 11: «Параметры» → «Конфиденциальность и защита» → «Микрофон» (и отдельно «Камера») → включите доступ для Teams или Zoom. macOS: «Системные настройки» → «Конфиденциальность и безопасность» → «Микрофон» / «Камера». Перезайдите в звонок — устройство должно заработать."
    unless_symptoms: [приложение не запускается]
  - id: rejoin_call
    title: Выйдите из звонка и зайдите снова
    instruction: Нажмите «Выйти» или «Покинуть», закройте программу и снова откройте ссылку на встречу. Если после этого вас слышно и видно — всё в порядке.
    unless_symptoms: [приложение не запускается]
  - id: use_web_or_phone
    title: Подключитесь с телефона или через браузер
    instruction: Откройте ссылку на встречу на телефоне или в браузере на компьютере — Teams и Zoom работают в браузере без установки. Если так звонок идёт нормально — продолжайте встречу, программу починим после.
    workaround: true
verify_question: Звук и видео в звонке работают нормально?
