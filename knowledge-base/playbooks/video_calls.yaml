id: video_calls
title: Проблемы с видеозвонком
service: Видеосвязь
default_urgency: medium
escalation_team: Service Desk L2 (рабочие места)
keywords: [zoom, зум, teams, тимс, телемост, видеозвон, видеоконфер, созвон, звонок, микрофон, камер, наушник, гарнитур, не слышат, не слышу, не видят, звук, конференц]
symptoms_hints:
  собеседники не слышат: [меня не слышат, не слышат меня, микрофон не работает, не работает микрофон]
  не слышно собеседников: [не слышу, нет звука, пропал звук]
  камера не работает: [камера не, не видят меня, черный экран камеры, чёрный экран камеры, не работает камера]
  звонок прерывается: [прерывается, лагает, заикается, зависает видео]
questions:
  - fact: call_app
    text: В какой программе проходит звонок?
    kind: choice
    options:
      zoom: [zoom, зум]
      teams: [teams, тимс]
      telemost: [телемост, яндекс]
      other: [друг, не знаю]
  - fact: headset
    text: Вы используете наушники или гарнитуру?
    kind: yes_no
steps:
  - id: check_mute_and_device
    title: Проверьте выбранные устройства
    instruction: В окне звонка нажмите стрелку рядом со значком микрофона или камеры и выберите правильное устройство. Проверьте, что микрофон не выключен (не перечёркнут).
  - id: reconnect_headset
    title: Переподключите гарнитуру
    instruction: Отключите наушники или гарнитуру и подключите снова. Если это Bluetooth — выключите и включите Bluetooth, затем выберите гарнитуру в настройках звонка.
    when: {headset: ["yes"]}
  - id: check_privacy_permissions
    title: Разрешите доступ к камере и микрофону
    instruction: "Параметры → Конфиденциальность и защита → Микрофон (и отдельно Камера): включите доступ для приложений и для программы звонков."
  - id: rejoin_call
    title: Перезайдите в звонок
    instruction: Выйдите из звонка, полностью закройте программу и войдите снова по той же ссылке.
  - id: use_web_or_phone
    title: Подключитесь с телефона
    instruction: Чтобы не пропустить встречу, подключитесь к звонку с телефона по той же ссылке, пока мы разбираемся с компьютером.
verify_question: Звук и видео в звонке работают нормально?
