id: access_rights
title: Нет прав доступа к ресурсу
service: Права доступа
default_urgency: medium
escalation_team: Администраторы доступа
escalation_note: "Новый доступ открывают администраторы после согласования, сам я его выдать не могу. Куда нужен доступ, уже записал: «{resource}»."
escalate_on_symptoms: [нужен новый доступ]
keywords: [нет доступа, доступ запрещ, access denied, "403", нет прав, недостаточно прав, выдать доступ, выдайте доступ, дать доступ, дайте доступ, открыть доступ, откройте доступ, нужен доступ, пропал доступ, доступ к, доступ в, права, папк, общий диск, сетевой диск, шар, sharepoint, роль]
examples:
  - нужен доступ к папке отдела
  - не открывается общая папка, пишет нет прав
  - дайте права на редактирование документа
  - пропал доступ к сетевому диску
  - access denied при открытии ресурса
  - новому сотруднику нужен доступ к системе
  - не могу сохранить файл в общую папку, нет разрешения
  - попросили выдать роль в программе
  - ошибка 403 при входе в раздел
  - раньше был доступ к папке, теперь нет
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "нет доступа к папке"
  - "нужен доступ к общему диску"
  - "доступ запрещён"
  - "access denied при открытии файла"
  - "откройте доступ к шаре"
  - "нужны права на редактирование документа"
  - "выдайте доступ к sharepoint"
  - "ошибка 403 на внутреннем сайте"
  - "новый сотрудник, нет доступа к папкам"
  - "не могу сохранить файл в общую папку"
  - "нужна роль в системе"
  - "раньше папка открывалась, теперь нет прав"
  - "дайте доступ в 1С"
  - "нужен доступ к проекту в джире"
  - "не вижу папку отдела на сетевом диске"
  - "шара не открывается, отказано в доступе"
  - "доступа нет к отчётам"
  - "недостаточно прав"
symptoms_hints:
  доступ запрещён: [доступ запрещ, access denied, "403", нет прав, недостаточно прав, запрещено]
  доступ пропал: [пропал доступ, исчез доступ, доступ пропал, больше нет доступа, был доступ]
  нужен новый доступ: [выдать доступ, выдайте доступ, дать доступ, дайте доступ, открыть доступ, откройте доступ, нужен доступ, нужно доступ, предоставить доступ, новый сотрудник]
questions:
  - fact: resource
    text: К чему нужен доступ? Подойдёт название папки, системы или ссылка.
    why: "Доступ выдают к конкретной папке или системе — без названия заявку не выполнить."
    kind: text
  - fact: had_access_before
    text: Раньше у вас был доступ к этому ресурсу?
    why: "Если доступ был и пропал — это сбой, проверим его; если нужен впервые — оформим заявку."
    kind: yes_no
    # For a new access request the answer does not change anything: it goes to admins.
    unless_symptoms: [нужен новый доступ]
steps:
  - id: relogin_refresh_groups
    title: Выйдите из учётной записи и войдите снова
    instruction: "Если доступ выдали недавно, он включится только после нового входа. Сохраните файлы. Windows: «Пуск» → ваше имя → «Выйти». macOS: меню Apple → «Завершить сеанс». Войдите снова и откройте ресурс — он должен открыться."
    when: {had_access_before: ["no"]}
  - id: check_correct_account
    title: Проверьте, под какой учётной записью вы вошли
    instruction: "В браузере посмотрите на значок профиля в правом верхнем углу сайта: там должен быть ваш рабочий адрес, а не личный. Если адрес другой — выйдите и войдите рабочим, и ресурс должен открыться."
  - id: vpn_for_resource
    title: Подключитесь к VPN
    instruction: Некоторые папки и системы открываются только из рабочей сети. Если вы не в офисе — включите VPN, дождитесь статуса «Подключено» и откройте ресурс снова.
    unless: {location: [office]}
verify_question: Теперь ресурс открывается и у вас есть нужные права?
