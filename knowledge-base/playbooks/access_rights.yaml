id: access_rights
title: Нет прав доступа к ресурсу
service: Права доступа
default_urgency: medium
escalation_team: Администраторы доступа
keywords: [нет доступа, доступ запрещ, access denied, "403", нет прав, недостаточно прав, выдать доступ, дать доступ, открыть доступ, права, папк, общий диск, сетевой диск, шар, sharepoint, роль]
symptoms_hints:
  доступ запрещён: [доступ запрещ, access denied, "403", нет прав, недостаточно прав, запрещено]
  нужен новый доступ: [выдать доступ, дать доступ, открыть доступ, нужен доступ, новый сотрудник]
questions:
  - fact: resource
    text: К какому ресурсу нужен доступ? Например, название папки, системы или адрес ссылки.
    kind: text
  - fact: had_access_before
    text: Раньше у вас был доступ к этому ресурсу?
    kind: yes_no
steps:
  - id: relogin_refresh_groups
    title: Выйдите из системы и войдите снова
    instruction: Если доступ выдали недавно, права применятся после повторного входа. Сохраните работу, выйдите из учётной записи Windows (Пуск → профиль → «Выйти») и войдите снова.
    when: {had_access_before: ["no"]}
  - id: check_correct_account
    title: Проверьте учётную запись
    instruction: Убедитесь, что вы вошли под своей рабочей учётной записью, а не под личной или общей. В браузере это видно в правом верхнем углу сайта.
  - id: vpn_for_resource
    title: Проверьте подключение к VPN
    instruction: Некоторые ресурсы открываются только из корпоративной сети. Если вы работаете из дома — подключитесь к VPN и попробуйте снова.
verify_question: Теперь ресурс открывается и у вас есть нужные права?
