id: printer
title: Не печатает принтер
service: Принтер
default_urgency: medium
escalation_team: Service Desk L1 (оргтехника)
# Bare "печат" is not a keyword: "клавиатура не печатает" is not about a printer.
keywords: [принтер, мфу, распечат, на печать, очередь печати, картридж, тонер, замят, зажева, застряла бумага, застрял лист]
examples:
  - принтер не печатает
  - бумага застряла в принтере
  - документ висит в очереди печати
  - компьютер не видит принтер
  - мфу зажевало лист
  - закончился картридж, печатает бледно
  - не могу распечатать документ
  - принтер пишет ошибку
  # Из ветки codex/nlu: живые формулировки с опечатками и сленгом.
  - "принтер ничего не печатает с утра"
  - "мфу не сканирует и не печатает"
  - "замяло бумагу"
  - "принтер жуёт бумагу"
  - "документы висят в очереди печати"
  - "принтер пишет замените картридж"
  - "закончился тонер"
  - "печать бледная"
  - "принтер в офлайне"
  - "принтер печатает полосами"
  - "застрял лист в принтере"
  - "принтер не виден на компьютере"
  - "принтер пишет ошибка"
  - "мфу не отвечает"
  - "не могу найти принтер в списке"
  - "печать зависла"
  - "распечатка выходит пустой"
  - "картридж пустой"
symptoms_hints:
  замятие бумаги: [замят, зажева, застрял лист, застряла бумага, бумага застряла, paper jam]
  закончилась бумага или тонер: [нет бумаги, закончилась бумага, кончилась бумага, тонер, картридж, бледно, полосами]
  задание не печатается: [не печата, не распечатыва, висит в очереди, очередь печати, молчит]
questions:
  # Needed only when we do not know yet what is wrong: the steps depend on it.
  - fact: error_text
    text: Что показывает принтер на экране или компьютер, когда вы печатаете? Можно своими словами.
    kind: text
    only_without_symptoms: true
steps:
  - id: clear_paper_jam
    title: Уберите застрявшую бумагу
    instruction: Откройте крышку или лоток, на который указывает принтер, и двумя руками аккуратно вытяните лист по ходу движения бумаги, не дёргая. Проверьте, что не осталось обрывков, и закройте крышки — печать должна продолжиться сама.
    when_symptoms: [замятие бумаги]
  - id: reload_paper_tray
    title: Поправьте бумагу в лотке
    instruction: "Выдвиньте лоток, выровняйте стопку: бумаги не больше отметки, направляющие прижаты к краям. Если бумага закончилась — доложите новую и задвиньте лоток; ошибка на экране принтера должна пропасть."
    when_symptoms: [замятие бумаги, закончилась бумага или тонер]
  - id: check_printer_ready
    title: Проверьте, что принтер включён и выбран
    instruction: "На экране принтера не должно быть ошибок. Windows 11: «Параметры» → «Bluetooth и устройства» → «Принтеры и сканеры» → ваш принтер: статус должен быть «Готов», а не «Автономно». macOS: «Системные настройки» → «Принтеры и сканеры». Если статус «Автономно» — нажмите «Не помогло»."
  - id: clear_print_queue
    title: Очистите очередь печати
    instruction: Там же, в «Принтеры и сканеры», откройте принтер → «Открыть очередь печати» (на Mac — двойной клик по принтеру), отмените все задания и отправьте документ заново. Он должен распечататься в течение минуты.
  - id: print_elsewhere
    title: Распечатайте на другом принтере
    instruction: "Если документ нужен срочно: в окне печати откройте список принтеров и выберите другой принтер офиса, например на соседнем этаже. Если так распечаталось — заберите документ, а этот принтер починим."
    workaround: true
verify_question: Принтер печатает?
