# Someone asks for another person's or a service password, key or token.
# Never answered by the assistant: access admins decide. Only exact phrases,
# never a bare "пароль" — "забыл пароль" stays with password_login.
id: credentials_request
title: Запрос чужих или служебных учётных данных
service: Права доступа
default_urgency: medium
escalation_team: Администраторы доступа
escalation_note: "Чужие и служебные пароли, ключи и токены я не сообщаю — их выдают администраторы по согласованию. И свой пароль тоже никому не пересылайте."
# Escalates through decide(), so the employee sees this explanation, not a template.
escalate_on_symptoms: [запрос учётных данных]
keywords: &credentials [пароль администратора, пароль админа, пароль от сервера, пароль root, root пароль, логин и пароль от, пароль коллеги, чужой пароль, пароль от базы, пароль от 1с, учетные данные от, служебн учетн, скажи пароль, дай пароль, дайте пароль, подскажи пароль, подскажите пароль, пришли пароль, пришлите пароль, сообщите пароль, какой пароль у, токен доступа, api ключ, ключ api, ssh ключ]
symptoms_hints:
  запрос учётных данных: *credentials
questions: []
steps: []
verify_question: Администраторы доступа связались с вами?
