# Коды ответов веб-сервисов. Общие: не меняют выбранный сценарий, но объясняют, что случилось.
playbook: service_unavailable
codes:
  - code: "502"
    title: Сервис временно недоступен
    meaning: Сервис не отвечает — обычно это временный сбой на сервере компании, а не проблема вашего компьютера.
    also: ["503", "504", "BAD GATEWAY", "SERVICE UNAVAILABLE", "GATEWAY TIMEOUT"]
    decides_scenario: false
    steps:
      - id: wait_refresh
        title: Подождите минуту и обновите страницу
        instruction: Подождите минуту и нажмите Ctrl+F5 (на Mac — Cmd+Shift+R). Если страница открылась — сбой был кратким. Если ошибка осталась — нажмите «Не помогло», передам дежурному инженеру.

  - code: "500"
    title: Ошибка на стороне сервиса
    meaning: Сервис сам сломался при обработке запроса. На вашем компьютере исправить нечего — нужен дежурный инженер.
    also: ["INTERNAL SERVER ERROR"]
    decides_scenario: false
    escalate_after_steps: true
    steps:
      - id: refresh_once
        title: Обновите страницу один раз
        instruction: Нажмите Ctrl+F5 (на Mac — Cmd+Shift+R). Если страница открылась — всё в порядке; если снова ошибка 500 — нажмите «Не помогло».

  - code: "403"
    playbook: access_rights
    title: Нет прав на этот раздел
    meaning: Сервис работает, но вашей учётной записи не хватает прав на этот раздел или файл.
    also: ["FORBIDDEN", "ACCESS DENIED"]
    decides_scenario: false
    steps:
      - id: right_account
        title: Проверьте, под какой учётной записью вы вошли
        instruction: Посмотрите на значок профиля в правом верхнем углу сайта — там должен быть ваш рабочий адрес. Если адрес другой — выйдите и войдите рабочим, и раздел должен открыться.

  - code: "401"
    playbook: password_login
    title: Сервис не принял вход
    meaning: Сервис не принял логин или сессия входа устарела.
    also: ["UNAUTHORIZED"]
    decides_scenario: false
    steps:
      - id: relogin
        title: Выйдите и войдите заново
        instruction: Нажмите «Выйти» в сервисе (или закройте вкладку), откройте его снова и войдите рабочим логином. Если вход прошёл — всё в порядке.
