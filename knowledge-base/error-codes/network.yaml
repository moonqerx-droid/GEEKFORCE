# Коды ошибок браузера и сети.
playbook: network_wifi
codes:
  - code: "ERR_INTERNET_DISCONNECTED"
    title: Нет подключения к интернету
    meaning: Компьютер сейчас не подключён к интернету — браузер не может ничего открыть.
    steps:
      - id: toggle_wifi
        title: Выключите и включите Wi-Fi
        instruction: "Windows: значок сети рядом с часами → выключите Wi-Fi и через 10 секунд включите. macOS: значок Wi-Fi в строке меню. Подключитесь к рабочей сети — сайты должны открыться."
      - id: hotspot
        title: Подключитесь к интернету с телефона
        instruction: Включите на телефоне раздачу интернета и подключите к ней ноутбук. Если сайты открылись — работайте так, пока разбираемся с основной сетью.
        workaround: true

  - code: "DNS_PROBE_FINISHED_NXDOMAIN"
    title: Браузер не нашёл адрес сайта
    meaning: Браузер не смог найти сайт по адресу — адрес написан с ошибкой, сайт внутренний и нужен VPN, или сбой в сети.
    also: ["ERR_NAME_NOT_RESOLVED", "DNS_PROBE_POSSIBLE"]
    steps:
      - id: check_address
        title: Проверьте адрес сайта
        instruction: Сравните адрес в строке браузера с правильным — одна опечатка уже ошибка. Если это внутренний сайт компании и вы не в офисе, включите VPN. Сайт должен открыться.
      - id: other_site
        title: Проверьте другой сайт
        instruction: Откройте yandex.ru. Если и он не открывается — дело в интернете, переподключите Wi-Fi. Если открывается, а нужный сайт нет — нажмите «Не помогло».

  - code: "ERR_CONNECTION_TIMED_OUT"
    title: Сайт не ответил вовремя
    meaning: Сайт или сеть отвечают слишком долго. Бывает при слабом интернете, без VPN для внутренних сайтов или когда сам сайт перегружен.
    also: ["ERR_CONNECTION_REFUSED", "ERR_TIMED_OUT"]
    steps:
      - id: other_site
        title: Проверьте другой сайт
        instruction: Откройте yandex.ru. Если он тоже не открывается — переподключите Wi-Fi. Если это внутренний сайт и вы не в офисе — включите VPN. Сайт должен открыться.

  - code: "ERR_CERT_DATE_INVALID"
    title: Браузер не доверяет сертификату сайта
    meaning: Браузер считает защиту сайта недействительной. Частая причина — неверные дата и время на компьютере.
    also: ["NET::ERR_CERT_DATE_INVALID", "ERR_CERT_AUTHORITY_INVALID"]
    decides_scenario: true
    steps:
      - id: clock
        title: Проверьте дату и время на компьютере
        instruction: "Посмотрите на часы в углу экрана: дата и время должны быть правильными. Если нет — Windows: «Параметры» → «Время и язык» → включите «Установить время автоматически»; macOS: «Системные настройки» → «Основные» → «Дата и время». Затем обновите сайт — предупреждение должно пропасть."
