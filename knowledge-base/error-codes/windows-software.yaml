# Коды ошибок Windows и установки программ.
playbook: app_not_starting
codes:
  - code: "1603"
    title: Установка программы прервалась
    meaning: Установщик программы остановился с общей ошибкой — часто мешает незавершённое обновление, открытая старая версия программы или нехватка прав.
    steps:
      - id: reboot_install
        title: Перезагрузите компьютер и повторите установку
        instruction: "Сохраните файлы и перезагрузите компьютер: Windows — «Пуск» → питание → «Перезагрузка». Сразу после включения запустите установку снова, не открывая другие программы. Если снова 1603 — нажмите «Не помогло»."
      - id: install_logs
        title: Разбор журнала установки
        instruction: Запустить установку с журналом (msiexec /l*v), найти причину по строке «Return value 3».
        requires_admin: true

  - code: "1618"
    title: Уже идёт другая установка
    meaning: На компьютере уже идёт другая установка или обновление — Windows разрешает только одну за раз.
    steps:
      - id: wait_install
        title: Подождите окончания другой установки
        instruction: Подождите 10–15 минут — возможно, в фоне ставятся обновления. Затем перезагрузите компьютер и запустите установку снова. Должна пройти без ошибки.

  - code: "1625"
    playbook: software_install
    title: Установка запрещена политикой компании
    meaning: Правила безопасности компании не дают ставить эту программу самостоятельно. Её ставят администраторы после согласования.
    also: ["1260"]
    escalate_after_steps: true
    steps:
      - id: catalog
        title: Поищите программу в каталоге компании
        instruction: "Windows: «Пуск» → «Центр программного обеспечения»; macOS: программа «Self Service». Если нужная программа там есть — нажмите «Установить», она поставится сама. Если нет — нажмите «Не помогло»."

  - code: "0x80070005"
    playbook: access_rights
    title: Отказано в доступе
    meaning: Windows запретила действие — у вашей учётной записи нет прав на этот файл, папку или установку.
    also: ["0x80070522"]
    decides_scenario: false
    steps:
      - id: right_account
        title: Проверьте, что вошли под своей учётной записью
        instruction: Нажмите «Пуск» — вверху или внизу меню видно имя учётной записи. Должна быть ваша рабочая. Если нет — выйдите и войдите своей, затем повторите действие.

  - code: "0xC000007B"
    title: Программа не запускается — не хватает системных компонентов
    meaning: Программе не хватает системных библиотек Windows или она не подходит к версии системы. Восстанавливает специалист.
    also: ["0xC0000135"]
    escalate_after_steps: true
    steps:
      - id: reboot_app
        title: Перезагрузите компьютер
        instruction: "Сохраните файлы. «Пуск» → питание → «Перезагрузка». После включения запустите программу первой — если она открылась, всё в порядке."
      - id: redistributables
        title: Восстановление системных компонентов
        instruction: Переустановить Visual C++ Redistributable и .NET нужных версий, проверить разрядность программы.
        requires_admin: true
