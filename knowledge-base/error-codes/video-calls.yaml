# Коды ошибок Teams и Zoom.
playbook: video_calls
codes:
  - code: "0xCAA20002"
    title: Teams не может выполнить вход
    meaning: Teams не смог войти в вашу учётную запись — обычно из-за устаревших сохранённых данных входа.
    also: ["0xCAA70004", "0xCAA20003", "0x80080300"]
    steps:
      - id: teams_web
        title: Откройте Teams в браузере
        instruction: Откройте teams.microsoft.com в браузере и войдите рабочим логином. Если так Teams работает — пользуйтесь им, пока исправляем программу.
        workaround: true
      - id: teams_relogin
        title: Выйдите из Teams и войдите снова
        instruction: В Teams нажмите на свой значок вверху → «Выйти». Закройте программу, откройте снова и войдите рабочим логином. Ошибка должна пропасть.
      - id: teams_cache
        title: Очистка кэша Teams
        instruction: Удалить папку кэша Teams (%appdata%\Microsoft\Teams или пакет new Teams), переустановить при необходимости.
        requires_admin: true

  - code: "5003"
    title: Zoom не может подключиться к серверу
    meaning: Zoom не достучался до своих серверов — мешает интернет, VPN или ограничения сети.
    also: ["104101", "104103", "104112", "5000", "5004"]
    steps:
      - id: zoom_browser
        title: Подключитесь к встрече из браузера или с телефона
        instruction: Откройте ссылку на встречу в браузере и выберите «Подключиться из браузера», или войдите с телефона. Если так встреча идёт — продолжайте, а программу проверим после.
        workaround: true
      - id: zoom_network
        title: Проверьте интернет и VPN
        instruction: Откройте любой сайт. Если VPN включён — отключите его на время звонка и подключитесь к встрече снова. Если Zoom подключился — дело было в сети.
