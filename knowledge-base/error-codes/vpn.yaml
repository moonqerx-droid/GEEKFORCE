# Коды ошибок VPN-подключения (Windows, встроенный клиент и типовые клиенты).
playbook: vpn_connection
codes:
  - code: "809"
    title: Сеть не пропускает VPN
    meaning: Сеть, к которой подключён компьютер, не пропускает VPN-соединение. Чаще всего так ведёт себя домашний роутер, гостевой Wi-Fi в отеле или кафе.
    steps:
      - id: hotspot
        title: Подключитесь к интернету с телефона
        instruction: Включите на телефоне раздачу интернета («Режим модема» на iPhone или «Точка доступа» на Android) и подключите к ней ноутбук по Wi-Fi. Затем снова включите VPN — если он подключился, дело было в прежней сети.
        workaround: true
      - id: restart_router
        title: Перезагрузите домашний роутер
        instruction: Выньте вилку роутера из розетки на 30 секунд и включите обратно. Через 2 минуты, когда индикаторы перестанут мигать, снова подключите VPN — должен появиться статус «Подключено».
      - id: router_vpn_passthrough
        title: Проверка настроек сети для VPN
        instruction: Проверить, пропускает ли сеть сотрудника протоколы VPN (IPsec/L2TP, IKEv2, NAT-T), при необходимости выдать профиль с другим протоколом.
        requires_admin: true

  - code: "691"
    title: VPN не принимает логин или пароль
    meaning: Сервер VPN не принял логин или пароль. Обычно это старый пароль после смены, лишний пробел или неверный формат логина; реже — заблокированная учётная запись.
    steps:
      - id: retype_credentials
        title: Введите логин и пароль заново
        instruction: Логин для VPN — рабочий, в формате имя@компания; пароль — тот же, что для входа в компьютер. Если недавно меняли пароль — введите новый. Проверьте раскладку и Caps Lock. Если снова ошибка 691 — нажмите «Не помогло».
      - id: check_account
        title: Проверка учётной записи для VPN
        instruction: Проверить, не заблокирована ли учётная запись и входит ли сотрудник в группу доступа к VPN.
        requires_admin: true

  - code: "800"
    title: Сервер VPN не отвечает
    meaning: Компьютер не смог достучаться до сервера VPN. Бывает, когда нет интернета, когда выбран не тот адрес сервера или сервер временно недоступен.
    steps:
      - id: check_internet
        title: Проверьте интернет без VPN
        instruction: "Откройте любой сайт, например yandex.ru. Если он не открывается — сначала нужен интернет: переподключите Wi-Fi или включите раздачу с телефона. Если сайт открылся, а VPN всё равно пишет 800 — нажмите «Не помогло»."
      - id: backup_server
        title: Подключитесь к запасному серверу
        instruction: В окне программы VPN откройте список в поле «Сервер», выберите запасной (обычно «vpn2» или «Backup») и нажмите «Подключить». Должен появиться статус «Подключено». Если списка нет — нажмите «Не могу выполнить».

  - code: "868"
    title: Не найден адрес сервера VPN
    meaning: Компьютер не может найти сервер VPN по имени. Часто это значит, что пропал интернет или в настройках VPN ошибка в адресе сервера.
    steps:
      - id: check_internet
        title: Проверьте интернет без VPN
        instruction: Откройте любой сайт, например yandex.ru. Если он не открывается — переподключите Wi-Fi или включите раздачу с телефона, затем снова VPN. Если сайты открываются, а ошибка 868 осталась — нажмите «Не помогло».
      - id: vpn_profile
        title: Проверка адреса сервера в профиле VPN
        instruction: Сверить адрес сервера в профиле VPN сотрудника с актуальным, переустановить профиль.
        requires_admin: true

  - code: "812"
    title: Нет разрешения на VPN
    meaning: Логин и пароль верные, но у учётной записи нет права подключаться по VPN. Самому это не исправить — права выдают администраторы.
    escalate_after_steps: true
    steps:
      - id: vpn_access_group
        title: Выдача права на VPN-доступ
        instruction: Добавить сотрудника в группу доступа к VPN после согласования с руководителем.
        requires_admin: true

  - code: "720"
    title: Сломаны сетевые компоненты VPN в Windows
    meaning: В Windows повреждены встроенные компоненты для VPN-подключений. Их восстанавливает специалист.
    also: ["789"]
    escalate_after_steps: true
    steps:
      - id: reboot
        title: Перезагрузите компьютер
        instruction: "Сохраните файлы. Windows: «Пуск» → кнопка питания → «Перезагрузка». После включения первым делом подключите VPN — если статус «Подключено», всё в порядке."
      - id: repair_wan_miniport
        title: Восстановление сетевых компонентов VPN
        instruction: Переустановить WAN Miniport, проверить службы IKE/IPsec и сертификаты L2TP.
        requires_admin: true

  - code: "807"
    title: VPN-соединение оборвалось
    meaning: Соединение с VPN было, но прервалось. Обычно из-за нестабильного интернета — слабый Wi-Fi или переключение между сетями.
    also: ["619"]
    steps:
      - id: closer_to_router
        title: Проверьте стабильность интернета
        instruction: Сядьте ближе к роутеру или подключитесь кабелем, закройте тяжёлые загрузки (облако, видео). Снова подключите VPN — если соединение держится несколько минут, проблема была в сигнале.
      - id: hotspot
        title: Подключитесь к интернету с телефона
        instruction: Включите на телефоне раздачу интернета и подключите к ней ноутбук. Если VPN через телефон не обрывается — дело в основной сети.
        workaround: true

  - code: "13801"
    title: Не принят сертификат VPN
    meaning: Сервер VPN не принял сертификат компьютера — он просрочен или не установлен. Выпускают сертификаты администраторы.
    also: ["13806", "13868"]
    escalate_after_steps: true
    steps:
      - id: certificate
        title: Перевыпуск сертификата для VPN
        instruction: Проверить срок и цепочку сертификата IKEv2 на компьютере сотрудника, перевыпустить.
        requires_admin: true
