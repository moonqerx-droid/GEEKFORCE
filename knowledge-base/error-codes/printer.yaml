# Коды ошибок печати Windows.
playbook: printer
codes:
  - code: "0x00000709"
    title: Windows не может выбрать принтер по умолчанию
    meaning: Windows не даёт сменить принтер по умолчанию — часто из-за автоматического выбора принтера самой системой.
    steps:
      - id: default_printer
        title: Выключите автоматический выбор принтера
        instruction: "Windows 11: «Параметры» → «Bluetooth и устройства» → «Принтеры и сканеры» → выключите «Разрешить Windows управлять принтером по умолчанию». Затем выберите нужный принтер → «Использовать по умолчанию». Печать должна пойти на него."
      - id: registry_default
        title: Исправление принтера по умолчанию в системе
        instruction: Исправить права на ключ реестра Windows\CurrentVersion\Windows для пользователя.
        requires_admin: true

  - code: "0x0000011B"
    title: Сетевой принтер не подключается после обновления Windows
    meaning: Обновление безопасности Windows запретило подключение к сетевому принтеру старым способом. Исправляет специалист.
    also: ["0x00000BCB"]
    escalate_after_steps: true
    steps:
      - id: print_elsewhere
        title: Распечатайте на другом принтере
        instruction: Если документ нужен срочно, выберите в окне печати другой принтер офиса. Если так распечаталось — заберите документ, а подключение этого принтера исправит специалист.
        workaround: true
      - id: print_server
        title: Переподключение принтера через сервер печати
        instruction: Подключить принтер через сервер печати с актуальным драйвером (Point and Print), проверить политику RPC для печати.
        requires_admin: true

  - code: "0x00000002"
    title: Не найден драйвер принтера
    meaning: Windows не находит драйвер (программу принтера). Драйверы ставит специалист.
    also: ["0x0000007E"]
    escalate_after_steps: true
    steps:
      - id: driver
        title: Установка драйвера принтера
        instruction: Установить драйвер принтера из каталога сервера печати.
        requires_admin: true
