# Коды ошибок Outlook и почты.
playbook: email_outlook
codes:
  - code: "0x800CCC0E"
    title: Outlook не может подключиться к почтовому серверу
    meaning: Outlook не достучался до почтового сервера. Чаще всего из-за отсутствия интернета или VPN, реже из-за сбоя профиля Outlook.
    also: ["0x800CCC0F", "0x80042108"]
    steps:
      - id: web_mail
        title: Откройте почту в браузере
        instruction: Откройте веб-почту (Outlook Web, адрес есть на портале компании) и войдите рабочим логином. Если там письма есть — ящик в порядке, работайте пока в браузере, а Outlook починим.
        workaround: true
      - id: check_connection
        title: Проверьте интернет и VPN
        instruction: Откройте любой сайт. Если работаете не из офиса — подключите VPN и дождитесь статуса «Подключено». Затем в Outlook нажмите «Отправить и получить» — письма должны начать приходить.
      - id: restart_outlook
        title: Перезапустите Outlook полностью
        instruction: "Закройте Outlook. Windows: Ctrl+Shift+Esc → выберите Outlook → «Снять задачу». macOS: правой кнопкой по значку в Dock → «Завершить». Откройте Outlook снова — ошибка должна пропасть."

  - code: "0x8004010F"
    title: Outlook не находит файл данных почты
    meaning: Outlook не может открыть файл, где хранится почта на компьютере, — обычно повреждён профиль Outlook. Его пересоздаёт специалист.
    escalate_after_steps: true
    steps:
      - id: web_mail
        title: Работайте пока в веб-почте
        instruction: Откройте веб-почту в браузере и войдите рабочим логином — там вся почта на месте. Если письма видны, вы на связи, а профиль Outlook исправит специалист.
        workaround: true
      - id: new_profile
        title: Пересоздание профиля Outlook
        instruction: Создать новый профиль Outlook, подключить ящик, проверить OST/PST.
        requires_admin: true

  - code: "0x80040600"
    title: Повреждён файл почты Outlook
    meaning: Файл, в котором Outlook хранит письма на компьютере, повреждён. Письма на сервере целы — файл восстанавливает специалист.
    also: ["0x80040116"]
    escalate_after_steps: true
    steps:
      - id: repair_pst
        title: Восстановление файла данных Outlook
        instruction: Проверить файл OST/PST средством восстановления (scanpst), при необходимости пересоздать OST.
        requires_admin: true

  - code: "0x8004060C"
    title: Переполнен файл почты Outlook
    meaning: Файл, где Outlook хранит письма, достиг предела размера — новые письма некуда класть.
    steps:
      - id: clean_mailbox
        title: Освободите место в почте
        instruction: Нажмите правой кнопкой на «Удалённые» → «Очистить папку», то же с «Нежелательной почтой». Удалите старые письма с большими вложениями. Когда места станет больше, письма снова начнут приходить.

  - code: "550"
    title: Почтовый сервер отклонил письмо
    meaning: Письмо не принял сервер получателя — чаще всего адрес написан с ошибкой или такого ящика больше нет.
    also: ["5.1.1"]
    decides_scenario: false
    steps:
      - id: check_address
        title: Проверьте адрес получателя
        instruction: Откройте вернувшееся письмо «Не доставлено» и сравните адрес с правильным — одна лишняя или пропущенная буква уже ошибка. Исправьте адрес и отправьте письмо снова — оно должно уйти без возврата.

  - code: "554"
    title: Письмо принято за спам
    meaning: Сервер получателя отклонил письмо, приняв его за спам или письмо с опасным вложением.
    also: ["5.7.1"]
    decides_scenario: false
    steps:
      - id: resend_link
        title: Отправьте файл ссылкой
        instruction: Если во вложении архив или большой файл, положите его в корпоративное облако и отправьте ссылку. Уберите из темы слова вроде «СРОЧНО» и «бесплатно». Если письмо ушло без возврата — всё в порядке.
