<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpFlow — проверка диалога</title>
    <link rel="stylesheet" href="/static/debug.css?v={{ assets['debug.css'] }}">
  </head>
  <body>
    <main class="workspace">
      <section class="conversation" aria-labelledby="page-title">
        <header class="topbar">
          <div>
            <p class="product">GEEKFORCE / HelpFlow</p>
            <h1 id="page-title">Проверка диалога</h1>
          </div>
          <span id="status" class="status">Нет диалога</span>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="empty-state">
            <strong>Начните тестовый диалог</strong>
            <span>Создайте обращение, затем опишите проблему обычными словами.</span>
          </div>
        </div>

        <div class="step-actions" aria-label="Результат шага">
          <button type="button" data-outcome="helped" disabled>Помогло</button>
          <button type="button" data-outcome="not_helped" disabled>Не помогло</button>
          <button type="button" data-outcome="cannot_perform" disabled>Не могу выполнить</button>
        </div>

        <form id="message-form" class="composer">
          <label for="message">Сообщение пользователя</label>
          <div class="composer-row">
            <textarea id="message" rows="2" placeholder="Например: не могу войти в CRM, а через 20 минут встреча" disabled></textarea>
            <button class="primary" type="submit" disabled>Отправить</button>
          </div>
        </form>

        <footer class="footer-actions">
          <button id="create" class="primary" type="button">Создать диалог</button>
          <button id="escalate" class="danger" type="button" disabled>Передать специалисту</button>
          <a class="text-link" href="/debug/operator">Открыть очередь специалиста</a>
          <span id="error" role="alert"></span>
        </footer>
      </section>

      <aside class="debug" aria-labelledby="debug-title">
        <header>
          <h2 id="debug-title">Debug JSON</h2>
          <span id="conversation-id">ID появится после создания</span>
        </header>
        <pre id="json">{}</pre>
      </aside>
    </main>
    <script src="/static/debug.js?v={{ assets['debug.js'] }}" defer></script>
  </body>
</html>
