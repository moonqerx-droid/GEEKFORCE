# Документы компании для эталонных вопросов — те же, что в демо-стенде.
- source_id: "document:travel:0"
  title: "Регламент командировок — Командировки"
  text: |
    # Командировки

    Суточные в командировке по России — 700 рублей в день, за рубежом — 2500 рублей в день.

    Авансовый отчёт сдаётся в бухгалтерию в течение трёх рабочих дней после возвращения.
- source_id: "document:travel:1"
  title: "Регламент командировок — Оформление"
  text: |
    ## Оформление

    Командировку согласует руководитель подразделения не позднее чем за пять рабочих дней до поездки.
- source_id: "document:vpn:0"
  title: "Инструкция по VPN — Удалённый доступ через VPN"
  text: |
    # Удалённый доступ через VPN

    Сотрудники подключаются к рабочим системам из дома только через VPN-клиент «Континент».
- source_id: "document:vpn:1"
  title: "Инструкция по VPN — Ошибка 809"
  text: |
    ## Ошибка 809

    Ошибка 809 означает, что домашний роутер блокирует VPN. Подключитесь к раздаче интернета с телефона и попробуйте снова.
- source_id: "document:passwords:0"
  title: "Правила паролей"
  text: |
    Пароли

    Пароль от рабочей учётной записи меняется раз в 90 дней. Новый пароль — не короче 10 символов, с заглавной и строчной буквами и цифрой.

    Забытый пароль сбрасывается на портале самообслуживания по SMS.
