# Эталонные диалоги: как пишут живые сотрудники, и чего мы ждём от помощника.
#
# say: реплики сотрудника по порядку. "@helped" / "@not_helped" / "@cannot" — кнопки у шага.
# playbook: какой сценарий должен вести диалог в конце (один или список допустимых).
# max_questions: сколько уточняющих вопросов допустимо до первого полезного действия
#   (шаг, ответ по документу, передача специалисту). По умолчанию 2.
# end: чем должен закончиться сценарий: step | escalated | answer | resolved (необязательно).
# tags: "понимание" — проверка распознавания (опечатки, сленг; зона классификатора),
#       "диалог" — поведение по ходу разговора.

- id: device-login-clean
