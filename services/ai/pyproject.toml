[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpflow-ai"
version = "0.1.0"
description = "GEEKFORCE HelpFlow AI triage: classification, clarifying questions, playbook steps, escalation summary"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["helpflow_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
